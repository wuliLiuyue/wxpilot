[package]
name = "wxp-daemon"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wxp-daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wxp-automator-client = { path = "../wxp-automator-client" }
wxp-common = { path = "../wxp-common" }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-tungstenite = "0.24"
