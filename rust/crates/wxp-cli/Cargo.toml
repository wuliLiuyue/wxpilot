[package]
name = "wxp-cli"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wxpilot"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
wxp-common = { path = "../wxp-common" }
wxp-rpc = { path = "../wxp-rpc" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
