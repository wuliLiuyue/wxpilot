[package]
name = "wxp-license-server"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wxp-license-server"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
wxp-license = { path = "../wxp-license" }

[dev-dependencies]
tempfile = "3"
ureq = { version = "2.10", features = ["json"] }
