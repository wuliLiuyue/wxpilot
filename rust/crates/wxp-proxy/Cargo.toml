[package]
name = "wxp-proxy"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[dependencies]
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = "0.23"
rustls-pemfile = "1"
serde_json = "1"
webpki-roots = "0.25"
wxp-store = { path = "../wxp-store" }
